# Photography gallery data.
#
# Each entry is a "folder" (a group of photos with a shared caption).
# A folder holds "boxes"; a box is one cell of the grid and is either
#   layout: landscape  -> one photo, displayed 150x100 css px
#   layout: portrait   -> two photos side by side, each 73 css px wide
#
# Per photo:
#   file    basename in assets/img/photography (no extension)
#   w, h    intrinsic size of the 1x thumbnail, used for width/height attrs
#   title   caption shown in the lightbox
#   alt     description of the image for screen readers and when images fail
#
# Derivatives (thumb/*@1x|2x|3x.avif|webp|jpg and large/*.jpg|avif) are
# generated from the originals by tools/build-images.js — re-run it after
# adding a photo here.

- caption: "Italy 2025-2026"
  boxes:
    - layout: landscape
      photos:
        - file: "20260322"
          w: 157
          h: 100
          title: "Spanish Steps, Rome. Italy 2026."
